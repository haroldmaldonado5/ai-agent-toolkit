<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>{page_title}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; padding: 2rem; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.5rem; margin-bottom: 2rem; opacity: 0.9; }
        .cta-button { background: white; color: #667eea; padding: 1rem 2rem; font-size: 1.2rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .cta-button:hover { transform: scale(1.05); transition: 0.3s; }
        form { margin-top: 2rem; }
        input { padding: 1rem; font-size: 1rem; border: none; border-radius: 25px; width: 300px; margin-right: 1rem; }
    </style>
</head>
<body>
    <section class='hero'>
        <div>
            <h1>{headline}</h1>
            <p>{subheadline}</p>
            <form action='{form_action}' method='POST'>
                <input type='email' name='email' placeholder='Tu email' required>
                <button type='submit' class='cta-button'>{cta_text}</button>
            </form>
        </div>
    </section>
</body>
</html>
